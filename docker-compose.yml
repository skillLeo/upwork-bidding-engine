services:
  mysql:
    image: mysql:8.4
    container_name: skillleo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: skillleo_engine
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - skillleo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: skillleo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - skillleo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  skillleo_mysql_data:
  skillleo_redis_data:
